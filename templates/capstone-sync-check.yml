# Capstone reference trust check — a TEMPLATE for your repo's CI.
# Copy into .github/workflows/, add an ANTHROPIC_API_KEY repo secret.
# Fails the job when the reference is stale, by parsing the report's
# final "SYNC CHECK:" verdict line (sync.md guarantees that line).
name: capstone-sync-check
on:
  pull_request:
jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # stamped commits must be reachable for git diff
      - name: Install Claude Code + capstone
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add GentBajko/capstone
          claude plugin install capstone@capstone-marketplace
      - name: Sync check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          out=$(claude -p "/capstone:sync check" 2>&1) || true
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep -E '^SYNC CHECK: ' | tail -1)
          if [ -z "$line" ]; then echo "no SYNC CHECK verdict found"; exit 1; fi
          case "$line" in
            "SYNC CHECK: current") exit 0 ;;
            *) echo "reference stale: $line"; exit 1 ;;
          esac
