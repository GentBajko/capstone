# Capstone reference review, a TEMPLATE for your repo's CI: the model
# half of `map check` (pointer drift, absorption drift, dependency
# re-vetting, logic and design coverage). Runs nightly and on demand,
# never per PR: the per-PR freshness gate is capstone-map-check.yml and
# needs no key. Copy into .github/workflows/ and add an
# ANTHROPIC_API_KEY repo secret. The job
# fails when the report's final "MAP REVIEW:" line reports findings
# (map.md guarantees that line); the script half's own verdict line also
# appears in the output and is ignored here on purpose, so one job never
# fails for both reasons.
name: capstone-map-review
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  map-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # stamped commits must be reachable for git diff
      - name: Install Claude Code + capstone
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add GentBajko/capstone
          claude plugin install capstone@capstone-marketplace
      - name: Headless config
        # non_interactive resolves every prompt to its default so the
        # run never hangs waiting for an answer (core.md's config key)
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/capstone.json <<'EOF'
          {
            "expertise": null,
            "teaching_mode": false,
            "docs_dir": "docs/capstone",
            "index_file": "docs/capstone/00-index.md",
            "subagent_threshold": 150,
            "docs_in_git": "ask",
            "language": "en",
            "non_interactive": true,
            "extract": ["logic", "uiux"],
            "interfaces": "auto",
            "interfaces_frontmatter": false,
            "cross_repo": "auto"
          }
          EOF
      - name: Map review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          out=$(claude -p "/capstone:map check" 2>&1) || true
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep -E '^MAP REVIEW: ' | tail -1)
          if [ -z "$line" ]; then echo "no MAP REVIEW verdict found"; exit 1; fi
          case "$line" in
            "MAP REVIEW: clean") exit 0 ;;
            *) echo "review findings: $line"; exit 1 ;;
          esac
