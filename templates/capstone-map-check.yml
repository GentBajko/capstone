# Capstone reference freshness gate, a TEMPLATE for your repo's CI.
# Copy into .github/workflows/. No API key: the gate is a bash script
# (skills/core/scripts/map-check.sh in the capstone repo, cloned at the
# release tag below) that diffs each chapter's stamp against the working
# tree, lists unfolded ledger fragments, and greps the schema. It ends
# with a "MAP CHECK:" verdict line (map.md guarantees it) and this job
# fails when that line says stale. Pointer drift, absorption, re-vetting
# and coverage need a model: see capstone-map-review.yml.
# A repo with no docs/capstone/00-index.md fails (there is no reference
# to trust); run /capstone:map once before enabling the gate.
# Monorepos with config `workspaces`: pass every workspace's docs area,
# e.g. `map-check.sh services/a/docs/capstone services/b/docs/capstone`.
name: capstone-map-check
on:
  pull_request:
jobs:
  map-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # stamped commits must be reachable for git diff
      - name: Fetch capstone
        run: git clone --depth 1 --branch v6.3.0 https://github.com/GentBajko/capstone "$RUNNER_TEMP/capstone"
      - name: Map check
        run: |
          out=$(bash "$RUNNER_TEMP/capstone/skills/core/scripts/map-check.sh" docs/capstone 2>&1) || true
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep -E '^MAP CHECK: ' | tail -1)
          if [ -z "$line" ]; then echo "no MAP CHECK verdict found"; exit 1; fi
          case "$line" in
            "MAP CHECK: current") exit 0 ;;
            *) echo "reference stale: $line"; exit 1 ;;
          esac
