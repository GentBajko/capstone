# Capstone reference trust check, a TEMPLATE for your repo's CI.
# Copy into .github/workflows/, add an ANTHROPIC_API_KEY repo secret.
# Fails the job when the reference is stale, by parsing the report's
# final "MAP CHECK:" verdict line (map.md guarantees that line).
name: capstone-map-check
on:
  pull_request:
jobs:
  map-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # stamped commits must be reachable for git diff
      - name: Install Claude Code + capstone
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin marketplace add GentBajko/capstone
          claude plugin install capstone@capstone-marketplace
      - name: Headless config
        # non_interactive resolves every prompt to its default so the
        # run never hangs waiting for an answer (core.md's config key)
        run: |
          mkdir -p ~/.claude
          cat > ~/.claude/capstone.json <<'EOF'
          {
            "expertise": null,
            "teaching_mode": false,
            "docs_dir": "docs/capstone",
            "index_file": "docs/capstone/00-index.md",
            "subagent_threshold": 150,
            "docs_in_git": "ask",
            "language": "en",
            "non_interactive": true,
            "extract": ["logic", "uiux"],
            "interfaces": "auto",
            "interfaces_frontmatter": false,
            "cross_repo": "auto"
          }
          EOF
      - name: Map check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          out=$(claude -p "/capstone:map check" 2>&1) || true
          printf '%s\n' "$out"
          line=$(printf '%s\n' "$out" | grep -E '^MAP CHECK: ' | tail -1)
          if [ -z "$line" ]; then echo "no MAP CHECK verdict found"; exit 1; fi
          case "$line" in
            "MAP CHECK: current") exit 0 ;;
            *) echo "reference stale: $line"; exit 1 ;;
          esac
