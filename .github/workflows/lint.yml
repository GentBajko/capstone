name: lint
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-file invariants
        run: bash skills/core/scripts/lint-sync.sh
      - name: Init-config runs and is idempotent
        run: |
          tmp="$RUNNER_TEMP/capstone-init"
          mkdir -p "$tmp"
          export CAPSTONE_GLOBAL_DIR="$RUNNER_TEMP/capstone-global"
          cd "$tmp"
          bash "$GITHUB_WORKSPACE/skills/core/scripts/init-config.sh" docs/capstone
          if [ ! -f "$CAPSTONE_GLOBAL_DIR/capstone.json" ]; then echo "global config not created"; exit 1; fi
          if [ -f docs/capstone/capstone.json ]; then echo "per-project config should not be created"; exit 1; fi
          if [ ! -f docs/capstone/.gitignore ]; then echo ".gitignore not created"; exit 1; fi
          if grep -q '^changelog\.md$' docs/capstone/.gitignore; then echo "fresh template ignores changelog.md"; exit 1; fi
          out=$(bash "$GITHUB_WORKSPACE/skills/core/scripts/init-config.sh" docs/capstone)
          case "$out" in *"exists:"*) ;; *) echo "second run not idempotent: $out"; exit 1;; esac
          printf 'changelog.md\n' >> docs/capstone/.gitignore
          out=$(bash "$GITHUB_WORKSPACE/skills/core/scripts/init-config.sh" docs/capstone)
          case "$out" in *"unignored: changelog.md"*) ;; *) echo "unignore migration did not report: $out"; exit 1;; esac
          if grep -q '^changelog\.md$' docs/capstone/.gitignore; then echo "stale changelog.md rule not removed"; exit 1; fi
          if ! grep -q '^features/$' docs/capstone/.gitignore; then echo "migration dropped other rules"; exit 1; fi
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem skills/core/scripts/*.ps1 | ForEach-Object {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errs)
            if ($errs) { Write-Output "PARSE ERRORS in $($_.Name):"; $errs; $failed = $true }
          }
          if ($failed) { exit 1 }

  # The PowerShell twin is the Windows contributor's only lint. Parsing it
  # is not enough - it must actually run, on both shells the docs name.
  lint-sync-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-file invariants (PowerShell 7)
        shell: pwsh
        run: ./skills/core/scripts/lint-sync.ps1
      - name: Cross-file invariants (Windows PowerShell 5.1)
        shell: powershell
        run: ./skills/core/scripts/lint-sync.ps1
      - name: Help script runs
        shell: pwsh
        run: |
          $out = ./skills/core/scripts/help.ps1
          if (-not $out) { Write-Output "help.ps1 produced no output"; exit 1 }
      - name: Init-config runs and is idempotent
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "capstone-init"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $env:CAPSTONE_GLOBAL_DIR = Join-Path $env:RUNNER_TEMP "capstone-global"
          Push-Location $tmp
          & $env:GITHUB_WORKSPACE/skills/core/scripts/init-config.ps1 docs/capstone
          if (-not (Test-Path (Join-Path $env:CAPSTONE_GLOBAL_DIR "capstone.json"))) { Write-Output "global config not created"; exit 1 }
          if (Test-Path docs/capstone/capstone.json) { Write-Output "per-project config should not be created"; exit 1 }
          if (-not (Test-Path docs/capstone/.gitignore)) { Write-Output ".gitignore not created"; exit 1 }
          if (Select-String -Path docs/capstone/.gitignore -Pattern '^changelog\.md$' -Quiet) { Write-Output "fresh template ignores changelog.md"; exit 1 }
          $out = @(& $env:GITHUB_WORKSPACE/skills/core/scripts/init-config.ps1 docs/capstone)
          if (($out -join ' ') -notmatch 'exists:') { Write-Output "second run not idempotent: $out"; exit 1 }
          Add-Content docs/capstone/.gitignore "changelog.md"
          $out = @(& $env:GITHUB_WORKSPACE/skills/core/scripts/init-config.ps1 docs/capstone)
          if (($out -join ' ') -notmatch 'unignored: changelog.md') { Write-Output "unignore migration did not report: $out"; exit 1 }
          if (Select-String -Path docs/capstone/.gitignore -Pattern '^changelog\.md$' -Quiet) { Write-Output "stale changelog.md rule not removed"; exit 1 }
          if (-not (Select-String -Path docs/capstone/.gitignore -Pattern '^features/$' -Quiet)) { Write-Output "migration dropped other rules"; exit 1 }
          Pop-Location
